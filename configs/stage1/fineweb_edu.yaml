stage: 1
dataset: fineweb_edu

metadata_filters:
  - {column: language, op: eq, value: "en"}
  - {column: language_score, op: gte, value: 0.95}
  - {column: int_score, op: gte, value: 4}
  - {column: token_count, op: gte, value: 512}

output_columns:
  - text
  - id
  - dump
  - url
  - date
  - file_path
  - language
  - language_score
  - token_count
  - score
  - int_score

shard:
  target_size_mb: 500
  max_documents: 200000
