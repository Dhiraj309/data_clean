stage: 1
dataset: finemath

# FineMath is already quality-selected. Start with a pass-through metadata stage.
# Once we lock the exact FineMath subset/path (e.g. 4+), narrow source_patterns here.
source_patterns:
  - "**/*.parquet"
  - "*.parquet"
metadata_filters: []
output_columns: "*"

shard:
  target_size_mb: 500
  max_documents: 150000
