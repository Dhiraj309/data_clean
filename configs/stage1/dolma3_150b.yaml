stage: 1
dataset: dolma3_150b

# The Dolma 3 sample is JSONL+zstd and organized by source/topic directories.
# Exclude explicitly adult-labelled Common Crawl slices at ingestion time.
source_exclude_patterns:
  - "data/common_crawl-adult_content-*/*"
metadata_filters: []
output_columns: "*"

shard:
  target_size_mb: 500
  max_documents: 150000
