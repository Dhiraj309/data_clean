pipeline:
  version: "5.1.0"

huggingface:
  token_env_var: "HF_TOKEN"
  private: true
  create_missing_output_repos: true

storage:
  local_work_dir: "./work"
  local_shard_dir: "./work/shards"

# Resource profile for bounded file-at-a-time execution. Download/upload
# workers have separate active limits and bounded waiting slots.
runtime:
  file_workers: 2
  download_workers: 1
  upload_workers: 1
  download_queue_size: 2
  upload_queue_size: 2
  max_inflight_files: 2
  batch_rows: 4096
  min_free_disk_gb: 5.0
  local_cache_dir: null
  local_temp_dir: null

compression:
  codec: "zstd"
  level: 6

hashing:
  algorithm: "xxh3_128"
  dedup_batch_size: 500

deduplication:
  normalized:
    enabled: true
    unicode_form: "NFKC"
    casefold: true
    collapse_whitespace: true
  near_duplicate:
    enabled: false
    bucket_bits: 8
    max_hamming_distance: 3
  source_priority:
    winner_policy: "highest_priority_then_source_key"

splits:
  version: 1
  validation_modulo: 100
  validation_remainder: 0
  test_modulo: 100
  test_remainder: null
  held_out_source_datasets: []
  temporal_cutoff: null
  synthetic_metadata_values: ["synthetic"]
  sealed_metadata_values: ["sealed"]

retry:
  download:
    max_attempts: 5
    base_delay_seconds: 2.0
    max_delay_seconds: 60.0
    jitter_seconds: 1.0
  upload:
    max_attempts: 5
    base_delay_seconds: 2.0
    max_delay_seconds: 60.0
    jitter_seconds: 1.0

logging:
  dir: "./logs"
  debug_log: "debug.log"
  events_log: "events.log"

plugins:
  filter_paths: []
