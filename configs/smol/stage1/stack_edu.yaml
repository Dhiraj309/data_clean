stage: 1
name: stack_edu
enabled: false
disabled_reason: >-
  HuggingFaceTB/stack-edu contains repository metadata and quality scores but no
  source-code/text column. Join blob_id against the original Stack source first,
  or use a text-bearing code corpus.

# Verified fields: blob_id, language, repo_name, path, src_encoding,
# length_bytes, score, int_score, detected_licenses, license_type.
source:
  repo_id: "HuggingFaceTB/stack-edu"
  revision: "main"
  split: "train"
  available_configs: [C, CSharp, Cpp, Go, Java, JavaScript, Markdown, PHP, Python, Ruby, Rust, SQL, Shell, Swift, TypeScript]

required_columns: [blob_id, language, repo_name, path, score, int_score]

special_handling:
  join_key: blob_id
  text_field_after_join: text
  code_length_field: length_bytes
  quality_fields: [score, int_score]

output:
  repo_id: "${FILTERED_REPO}"
  domain: "stack-edu"
  private: true
  run_id: "v1"
  path_prefix: ""
  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096
  max_documents: 1000000
  local_dir: "work/smol_stage1"
