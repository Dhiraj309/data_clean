stage: 1
name: finemath

# Verified config and fields on HuggingFaceTB/finemath.
source:
  repo_id: "HuggingFaceTB/finemath"
  config: "finemath-4plus"
  revision: "main"
  split: "train"
  path_prefix: "finemath-4plus"
  file_pattern: "*.parquet"

columns:
  text: text
  url: url
  language: language
  language_score: language_score
  token_count: token_count
  score: score
  int_score: int_score

required_columns:
  - text
  - language
  - token_count
  - int_score

filters:
  # FineMath is already English-filtered upstream.
  languages: [en]
  min_language_score: 0.90

  # FineMath-4plus already contains high-quality math documents.
  # Keep as an invariant/safety check.
  min_int_score: 4

  # Preserve concise but useful problems, proofs, derivations,
  # and mathematical explanations.
  min_token_count: 256

  # Outlier / corruption guards.
  max_words: 25000
  max_chars: 150000

  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "finemath-4plus"
  private: true
  run_id: "v1"
  path_prefix: ""

  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096

  max_documents: 1000000
  local_dir: "work/smol_stage1"