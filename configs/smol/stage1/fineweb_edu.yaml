stage: 1
name: fineweb_edu

source:
  repo_id: "HuggingFaceFW/fineweb-edu"
  revision: "main"
  split: "train"

columns:
  text: text
  id: id
  url: url
  language: language
  language_score: language_score
  token_count: token_count
  score: score
  int_score: int_score
  dataset: dataset

required_columns: [text, id, language]

filters:
  languages: [en]
  min_language_score: 0.95
  min_int_score: 3
  min_words: 50
  max_words: 100000
  min_chars: 200
  max_chars: 500000
  missing_policy: ignore

output:
  repo_id: "${FILTERED_REPO}"
  domain: "fineweb-edu"
  private: true
  run_id: "v1"
  path_prefix: ""
  target_size_mb: 500
  max_documents: 1000000
  local_dir: "work/smol_stage1"
