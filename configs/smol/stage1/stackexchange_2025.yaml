stage: 1
name: stackexchange_2025

# Stack Exchange rendered Q&A threads.
source:
  repo_id: "HuggingFaceTB/stackexchange_2025_md"
  revision: "main"
  split: "train"
  file_pattern: "*.parquet"

columns:
  text: ThreadText
  id: Id
  score: Score
  answer_count: AnswerCount
  accepted_answer_id: AcceptedAnswerId

required_columns:
  - ThreadText
  - Id
  - Score
  - AnswerCount

filters:
  # Light community-quality filter.
  # Score is the Stack Exchange vote score, not an ML quality score.
  min_score: 1

  # Prefer actual Q&A threads over unanswered questions.
  min_answer_count: 1

  # Preserve concise but useful technical / educational discussions.
  min_words: 100
  min_chars: 300

  # Outlier / corruption guards for extremely large rendered threads.
  max_words: 50000
  max_chars: 250000

  # Do not require an accepted answer; good answers may exist without one.
  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "stackexchange-2025"
  private: true
  run_id: "v1"
  path_prefix: ""

  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096

  max_documents: 1000000
  local_dir: "work/smol_stage1"