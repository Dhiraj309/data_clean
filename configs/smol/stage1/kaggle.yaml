stage: 1
name: kaggle

# Verified kaggle fields: file_id, text.
source:
  repo_id: "HuggingFaceTB/issues-kaggle-notebooks"
  config: "kaggle"
  revision: "main"
  split: "train"
  path_prefix: "kaggle"
  file_pattern: "*.parquet"

columns:
  text: text
  id: file_id

required_columns: [text, file_id]

filters:
  min_words: 100
  max_words: 100000
  min_chars: 400
  max_chars: 500000
  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "kaggle"
  private: true
  run_id: "v1"
  path_prefix: ""
  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096
  max_documents: 1000000
  local_dir: "work/smol_stage1"
