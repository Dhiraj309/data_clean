stage: 1
name: cosmopedia_v2

# Verified fields: prompt, text, token_length, audience, format, seed_data.
source:
  repo_id: "HuggingFaceTB/smollm-corpus"
  config: "cosmopedia-v2"
  revision: "main"
  split: "train"
  path_prefix: "cosmopedia-v2"
  file_pattern: "*.parquet"

columns:
  text: text
  token_count: token_length
  dataset: seed_data

required_columns:
  - text
  - token_length

filters:
  # Keep substantive educational samples while preserving topic diversity.
  min_token_count: 512

  # Primarily corruption/outlier guards; not intended to aggressively
  # remove legitimate long-form Cosmopedia content.
  max_words: 25000
  max_chars: 150000

  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "cosmopedia-v2"
  private: true
  run_id: "v1"
  path_prefix: ""

  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096

  max_documents: 1000000
  local_dir: "work/smol_stage1"