stage: 1
name: issues_kaggle
enabled: false
disabled_reason: >-
  The issues and kaggle configurations have different ID schemas and must be
  processed separately. Run issues.yaml and kaggle.yaml instead.

source:
  repo_id: "HuggingFaceTB/issues-kaggle-notebooks"
  revision: "main"
  split: "train"
  available_configs: [issues, kaggle]

variants:
  issues: "configs/smol/stage1/issues.yaml"
  kaggle: "configs/smol/stage1/kaggle.yaml"

output:
  repo_id: "${FILTERED_REPO}"
  domain: "issues-kaggle"
  private: true
  run_id: "v1"
  path_prefix: ""
  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096
  max_documents: 1000000
  local_dir: "work/smol_stage1"
