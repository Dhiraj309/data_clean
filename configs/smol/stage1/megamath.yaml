stage: 1
name: megamath_web_pro

# Verified raw Web-Pro shards contain one field: text. The source is already EN.
source:
  repo_id: "IFM/MegaMath"
  revision: "main"
  split: "train"
  path_prefix: "megamath-web-pro"
  file_pattern: "*.parquet"

columns:
  text: text

required_columns: [text]

filters:
  # Web-Pro has no token_count; Stage 1 estimates tokens as 1.3 * words.
  min_estimated_tokens: 256
  max_words: 150000
  max_chars: 750000
  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "megamath-web-pro"
  private: true
  run_id: "v1"
  path_prefix: ""
  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096
  max_documents: 1000000
  local_dir: "work/smol_stage1"
