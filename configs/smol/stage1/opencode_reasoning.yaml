stage: 1
name: opencode_reasoning

# Stage 1 exclusion:
# OpenCodeReasoning is synthetic prompt/response reasoning data explicitly
# designed for supervised fine-tuning, not base pretraining.
enabled: false

disabled_reason: >-
  OpenCodeReasoning contains synthetic competitive-programming supervision
  generated for supervised fine-tuning. Preserve its prompt, reasoning output,
  reference solution, source, difficulty, and license metadata for a dedicated
  later code-reasoning/SFT stage instead of flattening it into Stage 1
  pretraining text.

# Verified configs: split_0 and split_1.
# Fields: id, input, output, solution, dataset, license, split,
# source, difficulty, index.
#
# input is populated directly for split_0.
# Some split_1 questions need to be reconstructed from source metadata.
source:
  repo_id: "nvidia/OpenCodeReasoning"
  revision: "main"
  configs:
    - split_0
    - split_1
  splits:
    - split_0
    - split_1

columns:
  id: id
  prompt: input
  text: output
  reference_solution: solution
  dataset: dataset

required_columns:
  - id
  - output
  - solution
  - source
  - dataset
  - difficulty

selection:
  preserve_fields:
    - input
    - output
    - solution
    - source
    - dataset
    - split
    - difficulty
    - index
    - license

output:
  repo_id: "${FILTERED_REPO}"
  domain: "opencode-reasoning"
  private: true
  run_id: "v1"
  path_prefix: ""

  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096

  max_documents: 1000000
  local_dir: "work/smol_stage1"