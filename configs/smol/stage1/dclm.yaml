stage: 1
name: dclm

source:
  repo_id: "HuggingFaceFW/dclm_100BT-shuffled"
  revision: "main"
  split: "train"

columns:
  text: text
  id: id
  url: url
  language: language
  language_score: language_score
  fasttext_score: fasttext_score
  dataset: dataset

required_columns: [text, id, language, language_score, fasttext_score]

filters:
  languages: [en]
  min_language_score: 0.95
  # Official DCLM-Baseline OH-2.5 + ELI5 fastText cutoff.
  min_fasttext_score: 0.018112
  min_words: 50
  max_words: 100000
  min_chars: 200
  max_chars: 500000
  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "dclm"
  private: true
  run_id: "v1"
  path_prefix: ""
  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096
  max_documents: 1000000
  local_dir: "work/smol_stage1"
