stage: 1
name: issues

# Verified issues fields: repo_name, issue_id, text.
source:
  repo_id: "HuggingFaceTB/issues-kaggle-notebooks"
  config: "issues"
  revision: "main"
  split: "train"
  path_prefix: "issues"
  file_pattern: "*.parquet"

columns:
  text: text
  id: issue_id
  dataset: repo_name

required_columns: [text, issue_id, repo_name]

filters:
  min_words: 100
  max_words: 100000
  min_chars: 400
  max_chars: 500000
  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "issues"
  private: true
  run_id: "v1"
  path_prefix: ""
  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096
  max_documents: 1000000
  local_dir: "work/smol_stage1"
