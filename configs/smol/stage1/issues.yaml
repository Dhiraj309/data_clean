stage: 1
name: issues

# Verified fields: repo_name, issue_id, text.
source:
  repo_id: "HuggingFaceTB/issues-kaggle-notebooks"
  config: "issues"
  revision: "main"
  split: "train"
  path_prefix: "issues"
  file_pattern: "*.parquet"

columns:
  text: text
  id: issue_id
  dataset: repo_name

required_columns:
  - text
  - issue_id
  - repo_name

filters:
  # Preserve useful concise bug reports, discussions and fixes.
  min_words: 50
  min_chars: 200

  # Large GitHub issues are frequently dominated by logs,
  # stack traces or generated diagnostic dumps.
  max_words: 50000
  max_chars: 250000

  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "issues"
  private: true
  run_id: "v1"
  path_prefix: ""

  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096

  max_documents: 1000000
  local_dir: "work/smol_stage1"