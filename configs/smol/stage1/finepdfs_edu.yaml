stage: 1
name: finepdfs_edu

# Verified fields: text, id, dump, url, date, file_path, language,
# token_count, dataset. This release has no language_score field.
source:
  repo_id: "HuggingFaceFW/finepdfs_edu_100BT-shuffled"
  revision: "main"
  split: "train"
  file_pattern: "*.parquet"

columns:
  text: text
  id: id
  url: url
  language: language
  token_count: token_count
  dataset: dataset

required_columns:
  - text
  - id
  - language
  - token_count

filters:
  # English-only model.
  languages: [en]

  # Keep substantial long-form educational / academic PDF content.
  min_token_count: 1024

  # Generous upper bounds to retain valid papers, manuals,
  # reports, and textbook-style documents while removing outliers.
  max_words: 100000
  max_chars: 500000

  missing_policy: reject

output:
  repo_id: "${FILTERED_REPO}"
  domain: "finepdfs-edu"
  private: true
  run_id: "v1"
  path_prefix: ""

  target_size_mb: 1024
  staging_size_mb: 128
  buffer_batch_rows: 4096

  max_documents: 1000000
  local_dir: "work/smol_stage1"