stage: 2
dataset: fineweb_edu
dedup_namespace: "laughlm-hq-v2"
stage1_config: "../stage1/fineweb_edu.yaml"

text_column: text
id_column: id
cleaning:
  use_trafilatura: false
  use_ftfy: false
  symbol_lines_to_remove: []
custom_filters:
  - name: normalize_whitespace
    kwargs: {max_blank_lines: 2, strip: true}
  - name: length_filter
    kwargs: {min_chars: 500, max_chars: 500000}
datatrove_quality_filters: []
pii:
  enabled: true
  kwargs: {remove_emails: true, remove_ips: true, only_remove_public_ips: true}
output_metadata_fields:
  - dump
  - url
  - date
  - file_path
  - language
  - language_score
  - token_count
  - score
  - int_score
  - source_dataset
  - source_file
shard: {target_size_mb: 500, max_documents: 200000}
