stage: 2
dataset: stack_edu
dedup_namespace: "laughlm-hq-v1"
stage1_config: "../stage1/stack_edu.yaml"
text_column: text
id_column: id
cleaning: {use_trafilatura: false, use_ftfy: false, symbol_lines_to_remove: []}
custom_filters:
  - name: normalize_whitespace
    kwargs: {max_blank_lines: 3, strip: true}
  - name: length_filter
    kwargs: {min_chars: 100, max_chars: 2000000}
  - name: secret_filter
    kwargs: {max_secret_hits: 0}
datatrove_quality_filters: []
pii:
  enabled: true
  kwargs: {remove_emails: true, remove_ips: true, only_remove_public_ips: true}
output_metadata_fields: [source_dataset, source_file]
shard: {target_size_mb: 500, max_documents: 150000}
