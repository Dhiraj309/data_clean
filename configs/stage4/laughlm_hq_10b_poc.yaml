stage: 4
name: "laughlm-hq-10b-poc"
output_repo: "dignity045/laughlm-hq-10b-poc"

# Replace these only after the training tokenizer and EOS contract are frozen.
tokenizer_name_or_path: "REPLACE_WITH_FINAL_LAUGHLM_TOKENIZER"
eos_token: "REPLACE_WITH_FINAL_EOS_TOKEN"
eos_token_id: null
token_dtype: auto

exact_budget: true
tokenizer_batch_size: 256
seed: 309
domain_quotas: {}
time_quotas: {}

packing:
  mode: "document_eos"
  sequence_length: 2048
  eos_between_documents: true
  pad_to_multiple: null

# Source lineage. Exact per-output quotas are declared below.
sources:
  dolma3_150b:
    stage3_config: "../stage3/dolma3_150b.yaml"
  finepdfs_edu:
    stage3_config: "../stage3/finepdfs_edu.yaml"
  fineweb_edu:
    stage3_config: "../stage3/fineweb_edu.yaml"
  stack_edu:
    stage3_config: "../stage3/stack_edu.yaml"
  finemath:
    stage3_config: "../stage3/finemath.yaml"

# Build each output separately with: stage4_build.py ... --output <name>.
# The 100M validation corpus is held out by the deterministic Stage-3 split.
outputs:
  train:
    target_tokens: 10_000_000_000
    tokens_per_shard: 250_000_000
    allowed_splits: [train]
    source_tokens:
      dolma3_150b: 4_000_000_000
      finepdfs_edu: 2_000_000_000
      fineweb_edu: 1_500_000_000
      stack_edu: 1_500_000_000
      finemath: 1_000_000_000
  validation:
    target_tokens: 100_000_000
    tokens_per_shard: 50_000_000
    allowed_splits: [validation]
    source_tokens:
      dolma3_150b: 40_000_000
      finepdfs_edu: 20_000_000
      fineweb_edu: 15_000_000
      stack_edu: 15_000_000
      finemath: 10_000_000
